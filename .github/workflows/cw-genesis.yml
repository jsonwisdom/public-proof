name: CW Genesis Merkle EIP-712 (test keys only)
on:
  pull_request:
    paths:
      - "scripts/cw_genesis.py"
      - "tests/test_cw_genesis.py"
      - ".github/workflows/cw-genesis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed EIP-712 library version
        run: python -m pip install "eth-account==0.14.0"
      - name: Run positive and fail-closed negative tests
        run: python -m unittest discover -s tests -p 'test_cw_genesis.py' -v
